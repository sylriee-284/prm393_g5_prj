server.port=8080

# ====================================================================
# Test Database Configuration (In-Memory HSQLDB)
# ====================================================================
spring.datasource.url=jdbc:hsqldb:mem:noveltestdb;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.hsqldb.jdbc.JDBCDriver
spring.datasource.username=sa
spring.datasource.password=

# Auto-execute test schema and test seed data
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema-test.sql
spring.sql.init.data-locations=classpath:data-test.sql

# JWT Authentication Config
app.jwt.secret=TuTruyenPRM393Group5SecretKeyMustBeAtLeast256BitsLongForHMACSHA256Algorithm
app.jwt.access-token-expiration-ms=3600000
app.jwt.refresh-token-expiration-ms=604800000

logging.level.org.springframework.security=WARN
logging.level.com.prm393.novel=INFO
